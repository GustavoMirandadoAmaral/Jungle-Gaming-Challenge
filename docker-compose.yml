      - SQS_WAGER_DLQ_URL=http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      - SQS_WAGER_MAX_RECEIVE_COUNT=${SQS_WAGER_MAX_RECEIVE_COUNT:-5}
      - SQS_WAGER_VISIBILITY_TIMEOUT_SECONDS=${SQS_WAGER_VISIBILITY_TIMEOUT_SECONDS:-30}
      - SQS_OUTBOX_QUEUE_URL=http://localstack:4566/000000000000/integration-events.fifo
