      - PENDING_REFERENCE_TTL_MINUTES=${PENDING_REFERENCE_TTL_MINUTES:-60}
      - PENDING_REFERENCE_BACKOFF_BASE_MS=${PENDING_REFERENCE_BACKOFF_BASE_MS:-1000}
